name: Windows Crash Doctor Desktop

on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'scripts/collect-diagnostics.ps1'
      - 'windows-crash-doctor/**'
      - '.github/workflows/windows-crash-doctor-desktop.yml'
      - 'INSTALL-WINDOWS-CRASH-DOCTOR-GUI.cmd'
      - 'scripts/Install-WindowsCrashDoctorGui.ps1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-crash-doctor-desktop-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build desktop app
        shell: powershell
        run: |
          dotnet restore .\desktop\WindowsCrashDoctor.App\WindowsCrashDoctor.App.csproj
          dotnet publish .\desktop\WindowsCrashDoctor.App\WindowsCrashDoctor.App.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -o .\dist\win-x64

          if (-not (Test-Path .\dist\win-x64\WindowsCrashDoctor.exe)) {
            throw 'WindowsCrashDoctor.exe was not produced.'
          }

      - name: Validate package and hash
        shell: powershell
        run: |
          Get-FileHash .\dist\win-x64\WindowsCrashDoctor.exe -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  WindowsCrashDoctor.exe" } |
            Set-Content .\dist\win-x64\WindowsCrashDoctor.exe.sha256 -Encoding ascii
          Get-ChildItem .\dist\win-x64 | Format-Table Name, Length

      - name: Upload desktop build artifact
        uses: actions/upload-artifact@v4
        with:
          name: WindowsCrashDoctor-win-x64
          path: |
            dist/win-x64/WindowsCrashDoctor.exe
            dist/win-x64/WindowsCrashDoctor.exe.sha256
          retention-days: 30

      - name: Publish rolling desktop preview release
        if: github.ref == 'refs/heads/main'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'windows-crash-doctor-desktop-latest'
          $repo = $env:GITHUB_REPOSITORY
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
            'User-Agent' = 'windows-crash-doctor-release'
          }

          # Query through the REST API so a normal first-run 404 never becomes
          # a PowerShell NativeCommandError.
          $existing = $null
          try {
            $existing = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$repo/releases/tags/$tag" -Method Get
          }
          catch {
            $status = $null
            if ($_.Exception.Response) { $status = [int]$_.Exception.Response.StatusCode }
            if ($status -ne 404) { throw }
          }

          if ($existing) {
            Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$repo/releases/$($existing.id)" -Method Delete | Out-Null
            try {
              Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$repo/git/refs/tags/$tag" -Method Delete | Out-Null
            }
            catch {
              $status = $null
              if ($_.Exception.Response) { $status = [int]$_.Exception.Response.StatusCode }
              if ($status -ne 404) { throw }
            }
          }

          $notes = @'
          Native Windows desktop preview with a polished dashboard, one-click full diagnosis, live CPU/RAM/temperature telemetry, deep LibreHardwareMonitor logging, diagnostic history, dump analysis, provider management, local export and light/dark themes.

          The executable is currently unsigned, so Windows SmartScreen may show an Unknown Publisher warning. Source and build workflow are public in this repository.
          '@

          $body = @{
            tag_name = $tag
            target_commitish = $env:GITHUB_SHA
            name = 'Windows Crash Doctor Desktop Preview'
            body = $notes
            draft = $false
            prerelease = $true
          } | ConvertTo-Json

          Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$repo/releases" -Method Post -ContentType 'application/json' -Body $body | Out-Null

          & gh release upload $tag .\dist\win-x64\WindowsCrashDoctor.exe .\dist\win-x64\WindowsCrashDoctor.exe.sha256 --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload the desktop preview assets.' }
