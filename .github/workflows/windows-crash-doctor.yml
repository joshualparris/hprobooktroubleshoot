name: Windows Crash Doctor QA

on:
  push:
    paths:
      - 'windows-crash-doctor/**'
      - 'scripts/**'
      - '.github/workflows/windows-crash-doctor.yml'
  pull_request:
    paths:
      - 'windows-crash-doctor/**'
      - 'scripts/**'
      - '.github/workflows/windows-crash-doctor.yml'

permissions:
  contents: read

jobs:
  self-test:
    runs-on: windows-2025
    steps:
      # Pinned action SHAs make CI behaviour intentional rather than following a moving major tag.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Parse PowerShell sources
        shell: powershell
        run: |
          $diagnostics = New-Object System.Collections.Generic.List[string]
          Get-ChildItem '.\windows-crash-doctor', '.\scripts' -Recurse -File |
            Where-Object { $_.Extension -in @('.ps1', '.psm1') } |
            ForEach-Object {
              $tokens = $null
              $parseErrors = $null
              [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
              foreach ($parseError in @($parseErrors)) {
                $diagnostics.Add("$($_.FullName):$($parseError.Extent.StartLineNumber):$($parseError.Extent.StartColumnNumber): $($parseError.Message)")
              }
            }

          if ($diagnostics.Count -eq 0) {
            'PASS' | Set-Content -Path ci-parser-diagnostics.txt -Encoding UTF8
          }
          else {
            'FAIL' | Set-Content -Path ci-parser-diagnostics.txt -Encoding UTF8
            $diagnostics | Add-Content -Path ci-parser-diagnostics.txt -Encoding UTF8
          }

      - name: Upload parser diagnostics
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: crash-doctor-parser-diagnostics
          path: ci-parser-diagnostics.txt
          retention-days: 7

      - name: Enforce parser result
        shell: powershell
        run: |
          $status = Get-Content -Path ci-parser-diagnostics.txt -First 1
          if ($status -ne 'PASS') {
            Get-Content -Path ci-parser-diagnostics.txt | Write-Host
            exit 1
          }

      - name: Install exact QA module versions
        shell: pwsh
        run: |
          $catalog = (Get-Content '.\windows-crash-doctor\integrations\catalog.json' -Raw | ConvertFrom-Json).integrations
          $pesterVersion = [string](($catalog | Where-Object id -eq 'pester').packageVersion)
          $analyzerVersion = [string](($catalog | Where-Object id -eq 'psscriptanalyzer').packageVersion)
          if (-not (Get-Module -ListAvailable Pester | Where-Object Version -eq ([version]$pesterVersion))) {
            Install-Module Pester -RequiredVersion $pesterVersion -Scope CurrentUser -Force -SkipPublisherCheck
          }
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer | Where-Object Version -eq ([version]$analyzerVersion))) {
            Install-Module PSScriptAnalyzer -RequiredVersion $analyzerVersion -Scope CurrentUser -Force
          }
          Import-Module Pester -RequiredVersion $pesterVersion -Force
          Import-Module PSScriptAnalyzer -RequiredVersion $analyzerVersion -Force
          Write-Host "Pester $((Get-Module Pester).Version)"
          Write-Host "PSScriptAnalyzer $((Get-Module PSScriptAnalyzer).Version)"

      - name: Run PSScriptAnalyzer errors gate
        shell: pwsh
        run: |
          $catalog = (Get-Content '.\windows-crash-doctor\integrations\catalog.json' -Raw | ConvertFrom-Json).integrations
          $version = [string](($catalog | Where-Object id -eq 'psscriptanalyzer').packageVersion)
          Import-Module PSScriptAnalyzer -RequiredVersion $version -Force
          $issues = @()
          $issues += Invoke-ScriptAnalyzer -Path '.\windows-crash-doctor' -Recurse -Severity Error
          $issues += Invoke-ScriptAnalyzer -Path '.\scripts' -Recurse -Severity Error
          if ($issues.Count -gt 0) {
            $issues | Format-Table -AutoSize | Out-String | Write-Host
            exit 1
          }

      - name: Run code-principles invariant test
        shell: powershell
        run: .\windows-crash-doctor\tests\principles-self-test.ps1

      - name: Run Windows Crash Doctor self-test
        shell: powershell
        run: .\windows-crash-doctor\tests\self-test.ps1 -RepositoryMode

      - name: Run telemetry self-test
        shell: powershell
        run: .\windows-crash-doctor\tests\telemetry-self-test.ps1

      - name: Run WCD-001 synthetic dump parser regression test
        shell: powershell
        run: .\windows-crash-doctor\tests\dump-parser-test.ps1

      - name: Run WCD-001 real DbgHelp minidump smoke test
        shell: powershell
        run: .\windows-crash-doctor\tests\dump-parser-real-smoke.ps1

      - name: Run integration self-test
        shell: powershell
        run: .\windows-crash-doctor\tests\integration-self-test.ps1 -RepositoryMode

      - name: Run Pester integration tests
        shell: pwsh
        run: |
          $catalog = (Get-Content '.\windows-crash-doctor\integrations\catalog.json' -Raw | ConvertFrom-Json).integrations
          $version = [string](($catalog | Where-Object id -eq 'pester').packageVersion)
          Import-Module Pester -RequiredVersion $version -Force
          $config = New-PesterConfiguration
          $config.Run.Path = '.\windows-crash-doctor\tests\Integrations.Tests.ps1'
          $config.Run.PassThru = $true
          $config.Output.Verbosity = 'Detailed'
          $result = Invoke-Pester -Configuration $config
          if ($result.FailedCount -gt 0) { exit 1 }
