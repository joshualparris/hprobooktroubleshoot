name: Windows Crash Doctor QA

on:
  push:
    paths:
      - 'windows-crash-doctor/**'
      - 'scripts/**'
      - '.github/workflows/windows-crash-doctor.yml'
  pull_request:
    paths:
      - 'windows-crash-doctor/**'
      - 'scripts/**'
      - '.github/workflows/windows-crash-doctor.yml'

permissions:
  contents: read

jobs:
  self-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse CrashDoctor module
        shell: powershell
        run: |
          $tokens = $null; $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path '.\windows-crash-doctor\CrashDoctor.psm1'), [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count) { $parseErrors | Format-List | Out-String | Write-Host; exit 1 }

      - name: Parse CrashDoctor CLI
        shell: powershell
        run: |
          $tokens = $null; $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path '.\windows-crash-doctor\Invoke-CrashDoctor.ps1'), [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count) { $parseErrors | Format-List | Out-String | Write-Host; exit 1 }

      - name: Parse CrashDoctor self-test
        shell: powershell
        run: |
          $tokens = $null; $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path '.\windows-crash-doctor\tests\self-test.ps1'), [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count) { $parseErrors | Format-List | Out-String | Write-Host; exit 1 }

      - name: Parse collector
        shell: powershell
        run: |
          $tokens = $null; $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path '.\scripts\collect-diagnostics.ps1'), [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count) { $parseErrors | Format-List | Out-String | Write-Host; exit 1 }

      - name: Parse evidence utilities
        shell: powershell
        run: |
          foreach ($file in @('.\scripts\hash-evidence.ps1', '.\scripts\check-public-evidence.ps1')) {
            $tokens = $null; $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count) { Write-Host "Parse errors in $file"; $parseErrors | Format-List | Out-String | Write-Host; exit 1 }
          }

      - name: Run Windows Crash Doctor self-test
        shell: powershell
        run: .\windows-crash-doctor\tests\self-test.ps1 -RepositoryMode
