name: Windows Crash Doctor QA

on:
  push:
    paths:
      - 'windows-crash-doctor/**'
      - 'scripts/**'
      - '.github/workflows/windows-crash-doctor.yml'
  pull_request:
    paths:
      - 'windows-crash-doctor/**'
      - 'scripts/**'
      - '.github/workflows/windows-crash-doctor.yml'

permissions:
  contents: read

jobs:
  self-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse PowerShell files
        id: parse
        continue-on-error: true
        shell: powershell
        run: |
          $failed = $false
          $messages = New-Object System.Collections.Generic.List[string]
          Get-ChildItem windows-crash-doctor,scripts -Recurse -Include *.ps1,*.psm1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            foreach ($error in @($errors)) {
              $failed = $true
              $messages.Add("$($_.FullName):$($error.Extent.StartLineNumber):$($error.Extent.StartColumnNumber): $($error.Message)")
            }
          }
          if ($messages.Count -gt 0) {
            $messages | Set-Content -Path ci-parse-errors.txt -Encoding UTF8
            $messages | ForEach-Object { Write-Error $_ }
          }
          if ($failed) { exit 1 }

      - name: Upload parser diagnostics
        if: steps.parse.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: crash-doctor-parse-errors
          path: ci-parse-errors.txt
          if-no-files-found: error

      - name: Fail on parser errors
        if: steps.parse.outcome == 'failure'
        shell: powershell
        run: exit 1

      - name: Run Windows Crash Doctor self-test
        if: steps.parse.outcome == 'success'
        shell: powershell
        run: .\windows-crash-doctor\tests\self-test.ps1 -RepositoryMode
